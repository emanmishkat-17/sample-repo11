<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3">Contact Management</h1>
      <div>
        <input id="searchInput" class="form-control d-inline-block me-2" style="width:220px" placeholder="Search contacts">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contactModal" id="addBtn">Add Contact</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped" id="contactsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Company</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows populated by JS -->
        </tbody>
      </table>
    </div>

    <p id="emptyMsg" class="text-muted mt-3" style="display:none">No contacts yet — add one using the <strong>Add Contact</strong> button.</p>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="contactForm">
        <div class="modal-header">
          <h5 class="modal-title" id="contactModalLabel">Add Contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="contactId">

          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input id="name" required type="text" class="form-control" placeholder="John Doe">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" required type="email" class="form-control" placeholder="name@example.com">
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input id="phone" type="tel" class="form-control" placeholder="(555) 555-0123">
          </div>

          <div class="mb-3">
            <label class="form-label">Company</label>
            <input id="company" type="text" class="form-control" placeholder="Acme Corp">
          </div>

          <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea id="notes" class="form-control" rows="2" placeholder="Optional notes"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save contact</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
